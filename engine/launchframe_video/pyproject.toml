[project]
name = "launchframe-video"
version = "0.0.0"
description = "Video generation: one Claude Agent SDK run of the launch-motion skill on the launch-motion kit, from a product URL to an mp4."
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.180",
    "launchframe-providers",
    "httpx>=0.28",
    "starlette>=0.40",
    "uvicorn>=0.32",
]

[project.scripts]
lf-video = "launchframe_video.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launchframe_video"]
