[project]
name = "launchframe-providers"
version = "0.0.0"
description = "Providers: model and voice clients, record/replay cassettes, budget caps, cost ledgers, fake clients."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.28",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launchframe_providers"]
